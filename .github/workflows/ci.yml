name: AMRGuard CI

on:
  push:
    branches: [main, 'feat/**']
  pull_request:

jobs:
  backend-python313-postgres:
    name: Backend (Python 3.13 + PostgreSQL 16)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: amrguard_test
          POSTGRES_USER: amrguard_test
          POSTGRES_PASSWORD: synthetic_ci_password_not_for_prod_01
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U amrguard_test -d amrguard_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
      - name: Run Alembic upgrade and downgrade/upgrade roundtrip on PostgreSQL 16 + schema parity check
        working-directory: backend
        env:
          APP_ENV: test
          DATABASE_URL: postgresql+psycopg://amrguard_test:synthetic_ci_password_not_for_prod_01@127.0.0.1:5432/amrguard_test
          CREDENTIAL_HMAC_SECRET: synthetic-ci-hmac-secret-at-least-32-chars-long-001
        run: |
          alembic upgrade head
          alembic downgrade 0005_stewardship_reviews
          alembic upgrade head
          DATABASE_URL="sqlite:///./ci_schema_check.db" alembic upgrade head
          DATABASE_URL="sqlite:///./ci_schema_check.db" alembic check
          rm -f ci_schema_check.db
      - name: Run backend security, API, and PostgreSQL concurrency tests
        env:
          APP_ENV: test
          POSTGRES_TEST_DATABASE_URL: postgresql+psycopg://amrguard_test:synthetic_ci_password_not_for_prod_01@127.0.0.1:5432/amrguard_test
        run: pytest backend/tests -v

  frontend:
    name: Frontend (Typecheck + Production Build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck
      - name: Production build
        working-directory: frontend
        run: npm run build
